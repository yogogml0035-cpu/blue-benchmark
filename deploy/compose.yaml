# Single-server production deployment for Skill Eval Platform.
#
# Layout: nginx (only public port 80) -> web (Next.js) / api (FastAPI)
#         api and worker share one image; postgres stays on the internal
#         network; uploads and evidence live in the appdata volume.
#
# Copy this file plus nginx/nginx.conf and a filled-in .env to
# /opt/skill-eval/ on the server, then: docker compose up -d

services:
  nginx:
    image: ${REGISTRY:-docker.io/library}/nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${REGISTRY}/skill-eval-web:${TAG:-latest}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *logging

  api:
    image: ${REGISTRY}/skill-eval-api:${TAG:-latest}
    env_file: .env
    expose:
      - "8000"
    volumes:
      - appdata:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  worker:
    image: ${REGISTRY}/skill-eval-api:${TAG:-latest}
    command: ["python", "-m", "app.lib.operations.worker"]
    env_file: .env
    volumes:
      - appdata:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  postgres:
    image: ${REGISTRY:-docker.io/library}/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skill_eval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-skill_eval}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skill_eval} -d ${POSTGRES_DB:-skill_eval}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  appdata:
