# Reverse proxy for blue-benchmark.
#
# The browser only talks to nginx on port 80:
#   /api/*  -> FastAPI backend (auth, scenes, question library, intake)
#   /*      -> Next.js console (same-origin pages; cookies stay first-party)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;

    # Login brute-force mitigation: 5 requests/minute per IP, small burst.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;

    upstream backend {
        server api:8000;
    }

    upstream console {
        server web:3000;
    }

    server {
        listen 80;
        server_name _;

        # Evaluation-set zips can be large; nginx buffers bodies to disk.
        client_max_body_size 256m;

        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # AI-driven operations can take a while; keep the default 60s
            # read timeout generous but bounded.
            proxy_read_timeout 300s;
        }

        location = /healthz {
            proxy_pass http://backend;
        }

        location / {
            proxy_pass http://console;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
