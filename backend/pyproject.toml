[project]
name = "skill-eval-platform-backend"
version = "0.1.0"
description = "Minimal FastAPI walking skeleton for Skill Eval Platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "deepagents==0.7.11",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain==1.3.18",
  "langchain-anthropic==1.7.0",
  "langchain-core==1.6.1",
  "langchain-openai==1.6.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint==4.2.0",
  "langgraph-checkpoint-postgres==3.1.2",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "pydantic-settings>=2.7,<3",
  "pycryptodome==3.23.0",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
