[alembic]
script_location = migrations
prepend_sys_path = .
# 占位值，运行时永不生效：migrations/env.py 恒以 ALEMBIC_DATABASE_URL
# 或应用 settings.database_url 覆盖 sqlalchemy.url（online/offline 均如此）。
sqlalchemy.url = sqlite:///./storage/blue-benchmark.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
