<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#061a32" />
  <title>AURA · 登录</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7fbff;
      --muted: #91a7bd;
      --line: rgba(181, 211, 236, .24);
      --panel: rgba(5, 23, 43, .46);
      --accent: #31bfff;
      --accent-2: #246ce4;
      --danger: #ff8594;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 84%, rgba(0, 119, 132, .22), transparent 29%),
        radial-gradient(circle at 63% 36%, rgba(0, 83, 145, .11), transparent 24%),
        linear-gradient(116deg, #06172d 0%, #071d38 52%, #061a32 100%);
      color: var(--ink);
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    .particle-field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0 48%, rgba(3, 15, 30, .18) 67%, rgba(3, 15, 30, .4) 100%),
        linear-gradient(180deg, rgba(0, 9, 21, .18), transparent 28% 72%, rgba(0, 9, 21, .28));
    }

    .brand {
      position: fixed;
      z-index: 2;
      top: clamp(28px, 5vh, 56px);
      left: clamp(26px, 4vw, 64px);
      color: rgba(255, 255, 255, .94);
      font-size: 20px;
      font-weight: 500;
      letter-spacing: .72em;
      user-select: none;
    }

    main {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(360px, .8fr);
      align-items: center;
      min-height: 100vh;
      padding: 72px clamp(38px, 7vw, 120px) 52px;
    }

    .intro {
      align-self: end;
      max-width: 520px;
      padding: 0 0 clamp(20px, 5vh, 64px) clamp(0px, 2vw, 28px);
      text-shadow: 0 2px 28px rgba(0, 0, 0, .45);
    }

    .intro p {
      margin: 0 0 12px;
      color: rgba(221, 239, 250, .72);
      font-size: 13px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .intro h1 {
      max-width: 460px;
      margin: 0;
      font-size: clamp(34px, 4.4vw, 68px);
      font-weight: 320;
      line-height: 1.08;
      letter-spacing: -.035em;
    }

    .login-panel {
      justify-self: end;
      width: min(100%, 465px);
      padding: clamp(30px, 4vw, 52px);
      border: 1px solid rgba(194, 219, 239, .34);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(10, 34, 61, .62), rgba(3, 20, 39, .36));
      box-shadow: 0 34px 90px rgba(0, 4, 13, .28), inset 0 1px rgba(255, 255, 255, .04);
      backdrop-filter: blur(15px) saturate(115%);
      -webkit-backdrop-filter: blur(15px) saturate(115%);
    }

    .login-panel h2 {
      margin: 0 0 8px;
      font-size: clamp(30px, 3vw, 43px);
      font-weight: 520;
      letter-spacing: -.045em;
    }

    .subtitle {
      margin: 0 0 34px;
      color: var(--muted);
      font-size: 15px;
    }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      margin: 0 0 9px;
      color: #d8e7f2;
      font-size: 13px;
      font-weight: 560;
    }

    .input-wrap { position: relative; }

    .input-wrap svg {
      position: absolute;
      top: 50%;
      left: 16px;
      width: 20px;
      height: 20px;
      color: #8098ae;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .input-wrap input {
      width: 100%;
      height: 54px;
      padding: 0 48px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: rgba(3, 17, 34, .31);
      color: #f7fbff;
      caret-color: var(--accent);
      transition: border-color .22s, background .22s, box-shadow .22s;
    }

    .input-wrap input::placeholder { color: #627a92; }

    .input-wrap input:focus {
      border-color: rgba(49, 191, 255, .72);
      background: rgba(6, 28, 51, .58);
      box-shadow: 0 0 0 4px rgba(49, 191, 255, .09);
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 10px;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #849aaf;
      cursor: pointer;
      transform: translateY(-50%);
      transition: color .2s, background .2s;
    }

    .password-toggle:hover { color: #dff5ff; background: rgba(255,255,255,.05); }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: 2px 0 28px;
      font-size: 13px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      color: #cbdbe7;
      cursor: pointer;
    }

    .remember input {
      width: 17px;
      height: 17px;
      margin: 0;
      accent-color: var(--accent);
    }

    a { color: #2dafff; text-decoration: none; }
    a:hover { color: #71d2ff; text-decoration: underline; text-underline-offset: 4px; }

    .submit {
      position: relative;
      width: 100%;
      height: 56px;
      overflow: hidden;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(100deg, var(--accent-2), var(--accent));
      box-shadow: 0 13px 34px rgba(26, 132, 237, .25);
      color: white;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: .16em;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, filter .2s;
    }

    .submit::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 25%, rgba(255,255,255,.23) 50%, transparent 75%);
      transform: translateX(-120%);
      transition: transform .65s ease;
    }

    .submit:hover { transform: translateY(-2px); filter: brightness(1.07); box-shadow: 0 18px 42px rgba(26, 132, 237, .33); }
    .submit:hover::after { transform: translateX(120%); }
    .submit:active { transform: translateY(0); }
    .submit:disabled { cursor: wait; filter: saturate(.55); }

    .signup {
      margin: 26px 0 0;
      color: #839aaf;
      text-align: center;
      font-size: 13px;
    }

    .message {
      min-height: 18px;
      margin: 12px 0 -8px;
      color: #86e1b6;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 850px) {
      body { overflow: auto; }
      .veil { background: linear-gradient(rgba(2, 15, 29, .12), rgba(2, 15, 29, .56)); }
      main {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        padding: 104px 20px 36px;
      }
      .intro { display: none; }
      .login-panel { flex: 0 1 465px; min-width: 0; width: 100%; border-radius: 23px; }
      .brand { top: 28px; left: 28px; }
    }

    @media (max-width: 440px) {
      main { padding-inline: 14px; }
      .login-panel { flex-basis: calc(100vw - 28px); width: calc(100vw - 28px); padding: 30px 22px; }
      .options { align-items: flex-start; }
    }

    /* Static artwork mode: the approved preview is the visual source of truth. */
    body {
      background-color: #061a32;
      background-image: url("./particle-login-bg.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 100% 100%;
    }

    .particle-field,
    .veil,
    .brand,
    .intro { display: none; }

    main {
      display: block;
      min-height: 100vh;
      padding: 0;
    }

    .login-panel {
      position: fixed;
      top: 18.2vh;
      left: 62.5vw;
      width: 30.6vw;
      height: 65.5vh;
      min-height: 560px;
      padding: clamp(34px, 3.25vw, 56px);
      border-color: rgba(194, 219, 239, .33);
      border-radius: clamp(24px, 1.8vw, 35px);
      background: linear-gradient(145deg, rgb(7, 30, 54), rgb(4, 22, 42));
      box-shadow: 0 34px 90px rgba(0, 4, 13, .24), inset 0 1px rgba(255, 255, 255, .04);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    @media (max-width: 850px) {
      body {
        background-position: left center;
        background-size: auto 100%;
      }

      main {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        padding: 88px 20px 36px;
      }

      .login-panel {
        position: relative;
        inset: auto;
        flex: 0 1 465px;
        width: 100%;
        height: auto;
        min-height: 0;
        padding: clamp(30px, 7vw, 46px);
        border-radius: 23px;
        background: linear-gradient(145deg, rgba(7, 30, 54, .97), rgba(4, 22, 42, .97));
      }

      .brand {
        display: block;
        top: 27px;
        left: 28px;
      }
    }

    @media (max-width: 440px) {
      main { padding-inline: 14px; }
      .login-panel {
        flex-basis: calc(100vw - 28px);
        width: calc(100vw - 28px);
        padding: 30px 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .submit, .submit::after, .input-wrap input { transition: none; }
    }
  </style>
</head>
<body>
  <canvas class="particle-field" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>
  <div class="brand" aria-label="AURA">AURA</div>

  <main>
    <section class="intro" aria-label="品牌介绍">
      <p>Find your flow</p>
      <h1>让每一次抵达，<br />都有光的轨迹。</h1>
    </section>

    <section class="login-panel" aria-labelledby="login-title">
      <h2 id="login-title">欢迎回来</h2>
      <p class="subtitle">登录以继续</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">邮箱地址</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />
          </div>
        </div>

        <div class="field">
          <label for="password">密码</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入你的密码" minlength="6" required />
            <button class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>
        </div>

        <div class="options">
          <label class="remember"><input type="checkbox" name="remember" />记住我</label>
          <a href="#" onclick="return false">忘记密码？</a>
        </div>

        <button class="submit" type="submit">登 录</button>
        <p class="message" role="status" aria-live="polite"></p>
      </form>

      <p class="signup">还没有账号？ <a href="#" onclick="return false">创建账号</a></p>
    </section>
  </main>

  <script>
    const canvas = document.querySelector('.particle-field');
    const ctx = canvas.getContext('2d');
    const reducedMotion = true;
    let particles = [];
    let width = 0;
    let height = 0;
    let dpr = 1;
    let frame = 0;

    const ribbons = [
      { color: [43, 191, 255], count: 3600, radius: .95, spread: .035, phase: .035, alpha: .62 },
      { color: [255, 231, 52], count: 3000, radius: .76, spread: .032, phase: 0, alpha: .74 },
      { color: [58, 204, 148], count: 2200, radius: .60, spread: .029, phase: -.025, alpha: .56 },
      { color: [239, 252, 248], count: 1800, radius: .46, spread: .019, phase: -.055, alpha: .82 }
    ];

    function randomNormal() {
      return (Math.random() + Math.random() + Math.random() + Math.random() - 2) / 2;
    }

    function buildParticles() {
      particles = [];
      const compact = width < 850;
      const scale = compact ? .58 : Math.min(1.1, width / 1500);

      ribbons.forEach((ribbon, bandIndex) => {
        const count = Math.round(ribbon.count * scale);
        for (let i = 0; i < count; i++) {
          const progress = Math.random();
          const angle = -1.54 + progress * 1.42 + ribbon.phase;
          const noise = randomNormal() * ribbon.spread;
          const fieldSize = compact ? height * .92 : Math.min(width * .78, height * 1.3);
          const radius = fieldSize * (ribbon.radius + noise);
          particles.push({
            bandIndex,
            angle,
            radius,
            jitter: Math.random() * Math.PI * 2,
            drift: .003 + Math.random() * .008,
            size: .45 + Math.random() * 1.25,
            alpha: ribbon.alpha * (.25 + Math.random() * .75)
          });
        }
      });
    }

    function resize() {
      width = innerWidth;
      height = innerHeight;
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildParticles();
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      ctx.globalCompositeOperation = 'lighter';
      const compact = width < 850;
      const originX = compact ? width * -.08 : width * -.03;
      const originY = compact ? height * 1.07 : height * 1.12;
      const time = reducedMotion ? 0 : frame * .006;

      for (const p of particles) {
        const ribbon = ribbons[p.bandIndex];
        const wobble = Math.sin(time * p.drift * 45 + p.jitter) * 2.5;
        const x = originX + Math.cos(p.angle) * (p.radius + wobble);
        const y = originY + Math.sin(p.angle) * (p.radius + wobble);
        if (x < -4 || y < -4 || x > width * .72 || y > height + 4) continue;
        const fadeRight = Math.max(0, Math.min(1, (width * .74 - x) / (width * .18)));
        const [r, g, b] = ribbon.color;
        ctx.fillStyle = `rgba(${r},${g},${b},${p.alpha * fadeRight})`;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalCompositeOperation = 'source-over';
      frame++;
      if (!reducedMotion) requestAnimationFrame(draw);
    }

    addEventListener('resize', resize, { passive: true });
    resize();

    const toggle = document.querySelector('.password-toggle');
    const password = document.querySelector('#password');
    toggle.addEventListener('click', () => {
      const visible = password.type === 'text';
      password.type = visible ? 'password' : 'text';
      toggle.setAttribute('aria-pressed', String(!visible));
      toggle.setAttribute('aria-label', visible ? '显示密码' : '隐藏密码');
      password.focus();
    });

    const form = document.querySelector('#login-form');
    const message = document.querySelector('.message');
    const submit = document.querySelector('.submit');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      submit.disabled = true;
      submit.textContent = '登录中…';
      message.textContent = '';
      setTimeout(() => {
        sessionStorage.setItem('auraLoginEmail', document.querySelector('#email').value || 'name@example.com');
        location.href = './evaluation-set.html';
      }, 520);
    });
  </script>
</body>
</html>
